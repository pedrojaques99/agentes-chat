name: Desktop

# The desktop app for macOS, Windows and Linux. Started by hand on main with `release` = fix/feature/major: one
# job bumps the version (patch/minor/major) in tauri.conf.json, package.json and Cargo.toml, commits and tags
# `desktop-v<version>` on main; jobs build it (macOS universal, signed with our Developer ID and
# notarized when the Apple secrets are set, ad-hoc signed without them; Windows NSIS and Linux AppImage and deb,
# each for x64 and ARM64 on a runner of that architecture),
# each with the updater bundle signed with the updater key;
# one job publishes every file in the GitHub Release (the server reads those names, apps/server
# routes/desktop.ts):
#   macOS    agentes_<v>_universal.dmg (+ .sha256), agentes_<v>_universal.app.tar.gz (+ .sig)
#   Windows  agentes_<v>_x64-setup.exe, agentes_<v>_arm64-setup.exe (+ .sha256, + .sig: the installer is its own
#            updater bundle)
#   Linux    agentes_<v>_{amd64,arm64}.deb (+ .sha256), agentes_<v>_{amd64,arm64}.AppImage (+ .sha256, + .sig)
# Every app carries the runner and agent-browser (ADR 0040), and the server's own files, built once from the
# same commit (the `server` job: JavaScript and WebAssembly, the same on every system), for "Run agentes.chat
# on this computer" (ADR 0066; tauri.native.conf.json adds them to the resources). `none` only builds the
# current version as artifacts. `platforms` can leave systems out, also from a release: the server gives each
# system the newest release that has its download. macOS runners cost about 10x
# Linux minutes: this runs only by hand, never per PR; pushing a tag starts nothing.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "fix = 0.0.x, feature = 0.x.0, major = x.0.0; none = build only, no release"
        type: choice
        options: [fix, feature, major, none]
        default: fix
      notes:
        description: "Release notes (optional; default = commit subjects since the last release)"
        type: string
        required: false
      platforms:
        description: "Which builds"
        type: choice
        options: [all, macos+linux, macos, windows, linux]
        default: all

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      # main only takes pull requests; the release's deploy key is the one push the ruleset lets through.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # Before any build, so a failed bump costs no build minutes.
      - name: Bump the version, commit and tag
        if: ${{ inputs.release && inputs.release != 'none' }}
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          NOTES: ${{ inputs.notes }}
          HAS_KEY: ${{ secrets.RELEASE_DEPLOY_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::The RELEASE_DEPLOY_KEY secret is missing: a release pushes its version commit to main with that deploy key"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main (this run is on $GITHUB_REF); pick release = none for a test build"
            exit 1
          fi
          CURRENT=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$RELEASE" in
            fix) PATCH=$((PATCH + 1)) ;;
            feature) MINOR=$((MINOR + 1)); PATCH=0 ;;
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
          esac
          NEXT="$MAJOR.$MINOR.$PATCH"
          TAG="desktop-v$NEXT"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          PREV=$(git describe --tags --abbrev=0 --match 'desktop-v*' 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            NOTES=$(git log --no-merges --format='- %s' ${PREV:+"$PREV"..HEAD} | head -40)
          fi
          # Only the version line changes (jq would reformat the whole file).
          for f in apps/desktop/src-tauri/tauri.conf.json apps/desktop/package.json; do
            perl -0pi -e "s/\"version\": \"\Q$CURRENT\E\"/\"version\": \"$NEXT\"/" "$f"
          done
          perl -0pi -e "s/^version = \"\Q$CURRENT\E\"/version = \"$NEXT\"/m" apps/desktop/src-tauri/Cargo.toml
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(desktop): $NEXT"
          # main may move while this runs: rebase onto it and retry. Commit and tag go up
          # together (--atomic), so a rejected push never leaves a tag outside main.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git tag -f -a "$TAG" -m "$NOTES"
            if git push --atomic origin HEAD:main "refs/tags/$TAG"; then break; fi
            if [ "$attempt" = 3 ]; then echo "::error::Couldn't push the version to main"; exit 1; fi
          done
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          PKG=$(jq -r .version apps/desktop/package.json)
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          if [ "$VERSION" != "$PKG" ] || [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Versions differ: tauri.conf.json $VERSION, package.json $PKG, Cargo.toml $CARGO"
            exit 1
          fi
          if [ -n "${RELEASE_TAG:-}" ] && [ "${RELEASE_TAG#desktop-v}" != "$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG doesn't match the app version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # "Run agentes.chat on this computer" (ADR 0066): the server's server/ and web/ folders, from this commit, built
  # once on Linux (the same files on every system; on Windows the build's own paths would lose the bundled
  # packages' licenses) and shipped among each app's resources (tauri.native.conf.json), signed with the app.
  server:
    needs: version
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Build the server's files
        shell: bash
        run: |
          bun scripts/native-package.ts folders --out "$RUNNER_TEMP/native"
          rm -rf native
          mv "$RUNNER_TEMP"/native/agentes/* native
          test -s native/server/native.js
          test -s native/web/index.html
          du -sh native/server native/web native/licenses/npm

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-server
          path: |
            native/server
            native/web
            native/licenses/npm
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: [version, server]
    if: ${{ contains(fromJSON('["all", "macos+linux", "macos"]'), inputs.platforms || 'all') }}
    # GitHub's own macOS runner: the .dmg's window (its background, the icons' places) is laid out through Finder,
    # which needs a desktop session. On a runner without one Finder's AppleEvents time out (-1712) and the .dmg
    # comes out with a plain window.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BIN_DIR: apps/desktop/src-tauri/binaries
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: bun install --frozen-lockfile

      # The updater key is always required. Signing and notarization (Developer ID .p12 + App Store Connect API
      # key) are optional (ADR 0036 §10): with all six Apple secrets the app is signed and notarized; with none,
      # it is ad-hoc signed and the first open asks for "Open Anyway"; some but not all is a mistake.
      - name: Signing secrets
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is missing"
            exit 1
          fi
          APPLE=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8)
          MISSING=()
          for name in "${APPLE[@]}"; do
            if [ -z "${!name}" ]; then MISSING+=("$name"); fi
          done
          if [ "${#MISSING[@]}" -eq "${#APPLE[@]}" ]; then
            echo "::warning::No Apple signing secrets: the macOS app is ad-hoc signed, not notarized"
            echo "apple=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Apple signing secrets missing: ${MISSING[*]} (set all six, or none for an ad-hoc build)"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "apple=true" >> "$GITHUB_OUTPUT"

      # The runner ships inside the app as a Tauri sidecar: `binaries/agentes-runner-<target triple>`.
      # A universal build needs both arch binaries (one per cargo build) and the lipo'd universal one.
      - name: Compile the runner
        shell: bash
        run: |
          mkdir -p "$BIN_DIR"
          bun build --compile --target=bun-darwin-arm64 apps/server/runner/main.ts \
            --outfile "$BIN_DIR/agentes-runner-aarch64-apple-darwin"
          bun build --compile --target=bun-darwin-x64 apps/server/runner/main.ts \
            --outfile "$BIN_DIR/agentes-runner-x86_64-apple-darwin"
          lipo -create -output "$BIN_DIR/agentes-runner-universal-apple-darwin" \
            "$BIN_DIR/agentes-runner-aarch64-apple-darwin" "$BIN_DIR/agentes-runner-x86_64-apple-darwin"
          chmod +x "$BIN_DIR"/agentes-runner-*
          lipo -info "$BIN_DIR/agentes-runner-universal-apple-darwin"

      # agent-browser ships next to the runner as a second sidecar (ADR 0040): the pinned release, checked
      # against the SHA-256 in machine-protocol.ts (the one source of the version and the hashes), lipo'd
      # for the universal build. Tauri re-signs it with the Developer ID and the hardened runtime.
      - name: Fetch agent-browser
        shell: bash
        run: |
          bun -e '
            import { AGENT_BROWSER_SHA256, AGENT_BROWSER_VERSION, agentBrowserAsset } from "./packages/adapters/src/machine-protocol.ts";
            for (const target of ["darwin-arm64", "darwin-x64"]) {
              console.log([AGENT_BROWSER_VERSION, agentBrowserAsset(target), AGENT_BROWSER_SHA256[target]].join(" "));
            }
          ' > "$RUNNER_TEMP/agent-browser.txt"
          while read -r AB_VERSION ASSET SHA; do
            case "$ASSET" in
              *darwin-arm64) TRIPLE=aarch64-apple-darwin ;;
              *darwin-x64) TRIPLE=x86_64-apple-darwin ;;
            esac
            OUT="$BIN_DIR/agent-browser-$TRIPLE"
            curl -fsSL --retry 3 -o "$OUT" \
              "https://github.com/vercel-labs/agent-browser/releases/download/v$AB_VERSION/$ASSET"
            echo "$SHA  $OUT" | shasum -a 256 -c -
          done < "$RUNNER_TEMP/agent-browser.txt"
          lipo -create -output "$BIN_DIR/agent-browser-universal-apple-darwin" \
            "$BIN_DIR/agent-browser-aarch64-apple-darwin" "$BIN_DIR/agent-browser-x86_64-apple-darwin"
          chmod +x "$BIN_DIR"/agent-browser-*
          lipo -info "$BIN_DIR/agent-browser-universal-apple-darwin"

      # The server's files (the `server` job), among the app's resources (tauri.native.conf.json).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-server
          path: apps/desktop/src-tauri/native

      - name: Check the server's files
        shell: bash
        run: |
          test -s apps/desktop/src-tauri/native/server/native.js
          test -s apps/desktop/src-tauri/native/web/index.html
          test -d apps/desktop/src-tauri/native/licenses/npm

      - name: Icons and the .dmg's background
        working-directory: apps/desktop
        run: |
          bun scripts/icons.ts
          bun run tauri icon app-icon.png
          bun scripts/dmg-art.ts

      # The cached target may keep an older build's .app, .dmg and updater bundle (another name, another
      # version): the steps below pick the first one they find, so only this build's may be there.
      - name: Clear older bundles
        shell: bash
        run: rm -rf apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle

      - name: Build the app (universal, signed, notarized)
        if: ${{ steps.signing.outputs.apple == 'true' }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --target universal-apple-darwin --config src-tauri/tauri.native.conf.json

      # No Apple secrets: no APPLE_* variables at all (an empty one still counts as set for the bundler), and
      # no hardened runtime, which with an ad-hoc signature keeps WebKit's content process from starting.
      - name: Build the app (universal, ad-hoc signed)
        if: ${{ steps.signing.outputs.apple != 'true' }}
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: >-
            --target universal-apple-darwin --config src-tauri/tauri.native.conf.json
            --config src-tauri/tauri.adhoc.conf.json

      - name: Check the signature and the notarization
        shell: bash
        env:
          APPLE: ${{ steps.signing.outputs.apple }}
        run: |
          APP=$(ls -d apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/agentes-runner"
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/agent-browser"
          "$APP/Contents/MacOS/agent-browser" --version
          test -s "$APP/Contents/Resources/licenses/agent-browser/LICENSE"
          test -s "$APP/Contents/Resources/licenses/bun/LICENSE.md"
          test -s "$APP/Contents/Resources/LICENSE"
          test -s "$APP/Contents/Resources/NOTICE"
          test -s "$APP/Contents/Resources/server/native.js"
          test -s "$APP/Contents/Resources/web/index.html"
          if [ "$APPLE" != "true" ]; then
            codesign -dv "$APP" 2>&1 | grep -q '^Signature=adhoc$'
            echo "::notice::Ad-hoc signed: no notarization, the first open asks for Open Anyway"
            exit 0
          fi
          # Apple may take a moment to hand out the ticket after accepting the notarization, and the build's
          # own stapling then gives up quietly (0.5.4): staple again for a few minutes before checking. The
          # .dmg and the update keep the app as built; without a ticket, the Mac checks it online.
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler validate "$APP" > /dev/null 2>&1; then break; fi
            xcrun stapler staple "$APP" || sleep 30
          done
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Name the build files and the checksum
        shell: bash
        run: |
          BUNDLE=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          SRC=$(ls "$BUNDLE"/dmg/*.dmg | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::No .dmg in $BUNDLE/dmg"
            exit 1
          fi
          NAME="agentes_${VERSION}_universal.dmg"
          mkdir -p out
          cp "$SRC" "out/$NAME"
          (cd out && shasum -a 256 "$NAME" > "$NAME.sha256")
          TGZ=$(ls "$BUNDLE"/macos/*.app.tar.gz | head -1)
          if [ -z "$TGZ" ] || [ ! -s "$TGZ.sig" ]; then
            echo "::error::No signed updater bundle in $BUNDLE/macos"
            exit 1
          fi
          cp "$TGZ" "out/agentes_${VERSION}_universal.app.tar.gz"
          cp "$TGZ.sig" "out/agentes_${VERSION}_universal.app.tar.gz.sig"
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-macos
          path: out/*
          retention-days: 14

  windows:
    needs: [version, server]
    if: ${{ contains(fromJSON('["all", "windows"]'), inputs.platforms || 'all') }}
    # GitHub's own Windows runners, one per architecture: each build runs what it makes (the runner, agent-browser,
    # the server once). agent-browser has no Windows ARM build: Windows on ARM runs the x64 one, emulated.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            triple: x86_64-pc-windows-msvc
            # The baseline build: some x64 CPUs lack AVX2.
            bun: bun-windows-x64-baseline
            browser: win32-x64
          - arch: arm64
            triple: aarch64-pc-windows-msvc
            bun: bun-windows-arm64
            browser: win32-x64
    runs-on: ${{ matrix.arch == 'arm64' && (vars.CI_RUNNER_WINDOWS_ARM || 'windows-11-arm') || 'windows-latest' }}
    timeout-minutes: 60
    env:
      BIN_DIR: apps/desktop/src-tauri/binaries
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: bun install --frozen-lockfile

      # Tauri's sidecar name: `<name>-<target triple>.exe`.
      - name: Compile the runner
        shell: bash
        run: |
          mkdir -p "$BIN_DIR"
          bun build --compile --target=${{ matrix.bun }} apps/server/runner/main.ts \
            --outfile "$BIN_DIR/agentes-runner-${{ matrix.triple }}.exe"
          "$BIN_DIR/agentes-runner-${{ matrix.triple }}.exe" --version

      - name: Fetch agent-browser
        shell: bash
        run: |
          read -r AB_VERSION ASSET SHA < <(bun -e '
            import { AGENT_BROWSER_SHA256, AGENT_BROWSER_VERSION, agentBrowserAsset } from "./packages/adapters/src/machine-protocol.ts";
            console.log([AGENT_BROWSER_VERSION, agentBrowserAsset("${{ matrix.browser }}"), AGENT_BROWSER_SHA256["${{ matrix.browser }}"]].join(" "));
          ')
          OUT="$BIN_DIR/agent-browser-${{ matrix.triple }}.exe"
          curl -fsSL --retry 3 -o "$OUT" \
            "https://github.com/vercel-labs/agent-browser/releases/download/v$AB_VERSION/$ASSET"
          echo "$SHA  $OUT" | sha256sum -c -
          "$OUT" --version

      # The server's files (the `server` job), among the app's resources (tauri.native.conf.json).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-server
          path: apps/desktop/src-tauri/native

      - name: Check the server's files
        shell: bash
        run: |
          test -s apps/desktop/src-tauri/native/server/native.js
          test -s apps/desktop/src-tauri/native/web/index.html
          test -d apps/desktop/src-tauri/native/licenses/npm

      # The server here as the app runs it on Windows: it answers, and it stops when its stdin closes.
      - name: Run the server here once
        shell: bash
        run: bun apps/desktop/scripts/server-smoke.ts "$BIN_DIR/agentes-runner-${{ matrix.triple }}.exe" apps/desktop/src-tauri/native

      - name: Icons and the installer's pictures
        working-directory: apps/desktop
        run: |
          bun scripts/icons.ts
          bun run tauri icon app-icon.png
          bun scripts/installer-art.ts

      # The cached target may keep an older build's installer (another version): only this build's may be there.
      - name: Clear older bundles
        shell: bash
        run: rm -rf apps/desktop/src-tauri/target/release/bundle

      # Unsigned for now: SmartScreen asks once ("More info › Run anyway") until a code-signing certificate.
      - name: Build the app (NSIS)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --config src-tauri/tauri.native.conf.json

      # What the installer puts next to the app: the two sidecars and the server's files.
      - name: Check the app's files
        shell: bash
        run: |
          RELEASE=apps/desktop/src-tauri/target/release
          test -s "$RELEASE/agentes-runner.exe"
          test -s "$RELEASE/agent-browser.exe"
          test -s "$RELEASE/server/native.js"
          test -s "$RELEASE/web/index.html"
          test -s "$RELEASE/licenses/bun/LICENSE.md"
          test -s "$RELEASE/licenses/agent-browser/LICENSE"

      - name: Name the build files and the checksum
        shell: bash
        run: |
          BUNDLE=apps/desktop/src-tauri/target/release/bundle/nsis
          SRC=$(ls "$BUNDLE"/*-setup.exe | head -1)
          if [ -z "$SRC" ] || [ ! -s "$SRC.sig" ]; then
            echo "::error::No signed installer in $BUNDLE"
            exit 1
          fi
          NAME="agentes_${VERSION}_${{ matrix.arch }}-setup.exe"
          mkdir -p out
          cp "$SRC" "out/$NAME"
          cp "$SRC.sig" "out/$NAME.sig"
          (cd out && sha256sum "$NAME" > "$NAME.sha256")
          ls -l out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-windows-${{ matrix.arch }}
          path: out/*
          retention-days: 14

  linux:
    needs: [version, server]
    if: ${{ contains(fromJSON('["all", "macos+linux", "linux"]'), inputs.platforms || 'all') }}
    # 22.04: an older glibc, so the app runs on more distributions. One runner per architecture: each build runs what
    # it makes. `pkg`: the architecture in the files' names (Debian's).
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            triple: x86_64-unknown-linux-gnu
            # The baseline build: some x64 CPUs lack AVX2.
            bun: bun-linux-x64-baseline
            browser: linux-x64
            pkg: amd64
          - arch: arm64
            triple: aarch64-unknown-linux-gnu
            bun: bun-linux-arm64
            browser: linux-arm64
            pkg: arm64
    runs-on: ${{ matrix.arch == 'arm64' && (vars.CI_RUNNER_UBUNTU_22_ARM || 'ubuntu-22.04-arm') || (vars.CI_RUNNER_UBUNTU_22 || 'ubuntu-22.04') }}
    timeout-minutes: 60
    env:
      BIN_DIR: apps/desktop/src-tauri/binaries
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: System libraries
        run: |
          sudo apt-get update -qq
          # libfuse2: the AppImage bundler's own tool is an AppImage.
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file libfuse2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri -> target

      - run: bun install --frozen-lockfile

      - name: Compile the runner
        shell: bash
        run: |
          mkdir -p "$BIN_DIR"
          bun build --compile --target=${{ matrix.bun }} apps/server/runner/main.ts \
            --outfile "$BIN_DIR/agentes-runner-${{ matrix.triple }}"
          chmod +x "$BIN_DIR/agentes-runner-${{ matrix.triple }}"

      - name: Fetch agent-browser
        shell: bash
        run: |
          read -r AB_VERSION ASSET SHA < <(bun -e '
            import { AGENT_BROWSER_SHA256, AGENT_BROWSER_VERSION, agentBrowserAsset } from "./packages/adapters/src/machine-protocol.ts";
            console.log([AGENT_BROWSER_VERSION, agentBrowserAsset("${{ matrix.browser }}"), AGENT_BROWSER_SHA256["${{ matrix.browser }}"]].join(" "));
          ')
          OUT="$BIN_DIR/agent-browser-${{ matrix.triple }}"
          curl -fsSL --retry 3 -o "$OUT" \
            "https://github.com/vercel-labs/agent-browser/releases/download/v$AB_VERSION/$ASSET"
          echo "$SHA  $OUT" | sha256sum -c -
          chmod +x "$OUT"

      # The server's files (the `server` job), among the app's resources (tauri.native.conf.json).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: desktop-server
          path: apps/desktop/src-tauri/native

      - name: Check the server's files
        shell: bash
        run: |
          test -s apps/desktop/src-tauri/native/server/native.js
          test -s apps/desktop/src-tauri/native/web/index.html
          test -d apps/desktop/src-tauri/native/licenses/npm

      # The server here as the app runs it on Linux: it answers, and it stops when its stdin closes.
      - name: Run the server here once
        shell: bash
        run: bun apps/desktop/scripts/server-smoke.ts "$BIN_DIR/agentes-runner-${{ matrix.triple }}" apps/desktop/src-tauri/native

      - name: Icons
        working-directory: apps/desktop
        run: |
          bun scripts/icons.ts
          bun run tauri icon app-icon.png

      - name: Build the app (AppImage, deb)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's patchelf, except on the two sidecars: they keep their bytes in the AppImage too.
          PATCHELF: ${{ github.workspace }}/apps/desktop/scripts/patchelf-keep-sidecars.sh
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          # --verbose: without it a failed AppImage says only "failed to run linuxdeploy", never which file or step.
          args: --config src-tauri/tauri.native.conf.json --verbose

      - name: Name the build files and the checksums
        shell: bash
        run: |
          BUNDLE=apps/desktop/src-tauri/target/release/bundle
          DEB=$(ls "$BUNDLE"/deb/*.deb | head -1)
          APPIMAGE=$(ls "$BUNDLE"/appimage/*.AppImage | head -1)
          if [ -z "$DEB" ] || [ -z "$APPIMAGE" ] || [ ! -s "$APPIMAGE.sig" ]; then
            echo "::error::No deb, AppImage or its updater signature in $BUNDLE"
            exit 1
          fi
          mkdir -p out
          PKG=${{ matrix.pkg }}
          cp "$DEB" "out/agentes_${VERSION}_$PKG.deb"
          cp "$APPIMAGE" "out/agentes_${VERSION}_$PKG.AppImage"
          cp "$APPIMAGE.sig" "out/agentes_${VERSION}_$PKG.AppImage.sig"
          (cd out && for f in "agentes_${VERSION}_$PKG.deb" "agentes_${VERSION}_$PKG.AppImage"; do sha256sum "$f" > "$f.sha256"; done)
          ls -l out

      # What the deb puts on the computer: the two sidecars and the server's files (the AppImage has the same).
      - name: Check the app's files
        shell: bash
        run: |
          dpkg-deb -c "out/agentes_${VERSION}_${{ matrix.pkg }}.deb" > deb.txt
          for f in /agentes-runner /agent-browser /server/native.js /web/index.html /licenses/bun/LICENSE.md /licenses/agent-browser/LICENSE; do
            grep -q -- "$f\$" deb.txt || { echo "::error::$f is not in the deb"; exit 1; }
          done

      # The AppImage's sidecars are the ones built above, byte for byte (linuxdeploy rewrites any file it gives an
      # rpath; patchelf-keep-sidecars.sh keeps it off these two), and the runner still starts.
      - name: Check the AppImage's sidecars
        shell: bash
        run: |
          APPIMAGE="$PWD/out/agentes_${VERSION}_${{ matrix.pkg }}.AppImage"
          dir=$(mktemp -d)
          (cd "$dir" && "$APPIMAGE" --appimage-extract > /dev/null)
          for name in agentes-runner agent-browser; do
            cmp "$BIN_DIR/$name-${{ matrix.triple }}" "$dir/squashfs-root/usr/bin/$name" \
              || { echo "::error::The AppImage's $name isn't the one built"; exit 1; }
          done
          "$dir/squashfs-root/usr/bin/agentes-runner" --version

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-linux-${{ matrix.arch }}
          path: out/*
          retention-days: 14

      # The AppImage opens on a virtual screen, as a first run and on agentes.chat (the site under the cover): it
      # must still run after 25 s. The screenshots and the app's output go up as `desktop-linux-look`.
      - name: Open the app once
        shell: bash
        run: |
          sudo apt-get install -y -qq xvfb imagemagick dbus
          APPIMAGE="$PWD/out/agentes_${VERSION}_${{ matrix.pkg }}.AppImage"
          mkdir -p look
          look() {
            local name=$1 home
            home=$(mktemp -d)
            if [ "$name" = cloud ]; then
              mkdir -p "$home/.config/chat.agentes.desktop"
              echo '{"current":"https://app.agentes.chat","servers":["https://app.agentes.chat"]}' \
                > "$home/.config/chat.agentes.desktop/servers.json"
            fi
            # Its own folders, whatever the runner sets for XDG.
            HOME="$home" XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share" XDG_CACHE_HOME="$home/.cache" \
              xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- bash -c '
              "$0" > "$1.log" 2>&1 & app=$!
              sleep 25
              import -window root "$1.png"
              alive=0; kill -0 "$app" 2>/dev/null && alive=1
              kill "$app" 2>/dev/null; wait "$app" 2>/dev/null
              [ "$alive" = 1 ]' "$APPIMAGE" "$PWD/look/$name" \
              || { echo "::error::The app ended on its own ($name)"; cat "look/$name.log"; return 1; }
            echo "$name: $(find "$home" -name servers.json -exec cat {} \; | tr -d '\n ')"
          }
          look first
          look cloud

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-linux-look-${{ matrix.arch }}
          path: look/*
          retention-days: 14
          if-no-files-found: ignore

  # Release notes = the annotated tag's message (`git tag -a desktop-v0.2.0 -m "- Folders…"`).
  publish:
    needs: [version, macos, windows, linux]
    # A system left out is skipped, and a skipped need would skip this job too.
    if: ${{ !cancelled() && !failure() && needs.version.outputs.tag != '' }}
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.version.outputs.ref }}

      # Only the builds' files: the server's files and the Linux screenshots are artifacts too.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          pattern: desktop-{macos,windows-x64,windows-arm64,linux-x64,linux-arm64}
          merge-multiple: true

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > notes.txt
          if [ ! -s notes.txt ] || ! grep -q '[^[:space:]]' notes.txt; then echo "agentes.chat $VERSION" > notes.txt; fi
          # How to open it the first time while the builds aren't notarized/signed (ADR 0036 §10). It starts with
          # <!-- install -->, where the server cuts the notes the app shows on an update.
          { echo; sed -e "s|{{repo}}|$GITHUB_REPOSITORY|g" -e "s|{{version}}|$VERSION|g" .github/desktop-install.md; } >> notes.txt
          ls -l out
          gh release create "$TAG" out/* --title "agentes.chat $VERSION" --notes-file notes.txt
