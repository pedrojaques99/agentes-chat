name: iOS build

# Builds the phone app for iPhone here, without EAS: `expo prebuild` makes the native project from app.config.ts
# (it is never committed), xcodebuild archives it and exports it for the App Store, and the result goes to
# TestFlight (or stays as the run's artifact). Signing is automatic: Xcode asks Apple for the certificate and the
# profiles of the app and its share extension with the App Store Connect API key, so no certificate or profile is
# kept anywhere. Production only: testers get builds through TestFlight.
# Runs only by hand (Actions → Run workflow). See apps/mobile/README.md, "iOS on GitHub Actions".
#
# Secrets (repository settings, never in the repo):
#   APPLE_TEAM_ID: the Apple Developer team that owns chat.agentes.app
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID, ASC_API_KEY_P8: an App Store Connect API key (its id, the issuer id and the
#     .p8 file's text) with the Admin role, which automatic signing needs
# Variable (optional): IOS_BUILD_NUMBER_BASE, added to the run number (above the last build in App Store Connect).
# A secret still set to PLACEHOLDER (made so the names exist) counts as not set.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Send to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    # CI_RUNNER_MACOS names another macOS runner. The App Store takes only builds made with a current Xcode.
    runs-on: ${{ vars.CI_RUNNER_MACOS || 'macos-26' }}
    timeout-minutes: 90
    env:
      APP_VARIANT: production
    steps:
      # Fails in seconds, before anything is installed, when the key isn't there.
      - name: Apple secrets are set
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8; do
            value=$(printenv "$name" || true)
            if [ -z "$value" ] || [ "$value" = PLACEHOLDER ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then echo "See apps/mobile/README.md, \"iOS on GitHub Actions\"."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Expo SDK 58 needs Node 22.13 or later; eas.json builds on 24.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The newest Xcode on the runner.
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: bun install --frozen-lockfile
      - name: Build number
        env:
          BASE: ${{ vars.IOS_BUILD_NUMBER_BASE }}
        run: echo "IOS_BUILD_NUMBER=$(( ${BASE:-0} + GITHUB_RUN_NUMBER ))" >> "$GITHUB_ENV"
      # app.config.ts reads the team and the build number; the share extension takes both from the app.
      - name: Native project
        working-directory: apps/mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bunx expo prebuild --platform ios --clean --no-install
          cd ios
          command -v pod > /dev/null || sudo gem install cocoapods --no-document
          pod install
      # Written only now, after the dependencies' install scripts and CocoaPods ran: to the runner's temp folder,
      # outside the checkout, and deleted at the end.
      - name: App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        working-directory: apps/mobile/ios
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          # The whole log is long: only its end is shown, here in the run's log, where GitHub masks the secrets
          # (an artifact of the file would carry the team id unmasked).
          xcodebuild archive \
            -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -300 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -20 "$RUNNER_TEMP/archive.log"
          test -d "$RUNNER_TEMP/app.xcarchive"
      # With "Send to TestFlight", Xcode uploads the build itself; without it, the .ipa is written to the folder.
      - name: Export
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          destination=export
          if [ "$UPLOAD" = true ]; then destination=upload; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$destination</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_API_KEY_ID" -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"
          if [ "$UPLOAD" = true ]; then
            echo "::notice::Build $IOS_BUILD_NUMBER sent to App Store Connect; it shows in TestFlight once Apple processes it."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !inputs.upload }}
        with:
          name: ios-${{ env.IOS_BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
          # An .ipa is already compressed.
          compression-level: 0
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/ExportOptions.plist"
