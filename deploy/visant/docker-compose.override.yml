# Visant's VPS: the app behind Coolify's Traefik (which owns ports 80 and 443), on the `coolify` network,
# with no port published on the host. Next to docker-compose.yml in /opt/agentes; see docs/visant/PLANO-paridade.md.
services:
  postgres:
    # Its own name: on the coolify network "postgres" is another app's database.
    networks:
      default:
        aliases: [agentes-db]

  agentes:
    environment:
      DATABASE_URL: "postgres://agentes:${POSTGRES_PASSWORD}@agentes-db:5432/agentes"
    # No host port: Traefik reaches the container over the coolify network.
    ports: !reset []
    mem_limit: 3g
    memswap_limit: 3g
    networks: [default, speech, embeddings, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.agentes-http.entryPoints=http
      - traefik.http.routers.agentes-http.rule=Host(`agentes.visant.co`)
      - traefik.http.routers.agentes-http.middlewares=redirect-to-https
      - traefik.http.routers.agentes-https.entryPoints=https
      - traefik.http.routers.agentes-https.rule=Host(`agentes.visant.co`)
      - traefik.http.routers.agentes-https.tls=true
      - traefik.http.routers.agentes-https.tls.certresolver=letsencrypt
      - traefik.http.routers.agentes-https.service=agentes
      - traefik.http.routers.agentes-http.service=agentes
      - traefik.http.services.agentes.loadbalancer.server.port=3000

networks:
  coolify:
    external: true
